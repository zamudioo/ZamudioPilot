<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ZamudioPilot — Mouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <style>
    :root {
      --bg:         #090d12;
      --surface:    #0e1420;
      --surface2:   #162030;
      --surface3:   #1e2d40;
      --border:     rgba(77,157,224,0.12);
      --border-hi:  rgba(77,157,224,0.28);
      --accent:     #4d9de0;
      --accent-dim: rgba(77,157,224,0.15);
      --text:       #dce9f7;
      --text-muted: #5a7a9a;
      --danger:     #e05555;
      --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family:'Sora',sans-serif;
      background:var(--bg); color:var(--text);
      display:flex; justify-content:center; align-items:center;
      height:100dvh; overflow:hidden;
      padding-top:env(safe-area-inset-top);
    }
    .wrap {
      position:relative;
      width:100%; max-width:430px; height:100%;
      background:var(--surface);
      display:flex; flex-direction:column; overflow:hidden;
    }
    .top-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px 10px; border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .app-name { font-size:.7rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); }
    .status { display:flex; align-items:center; gap:6px; font-size:.62rem; color:var(--text-muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; box-shadow:0 0 7px #22c55e; transition:background .3s,box-shadow .3s; }
    .dot.off { background:var(--danger); box-shadow:0 0 7px var(--danger); }

    .tp-section {
      flex:1; display:flex; flex-direction:column;
      align-items:center; padding:14px; gap:12px; min-height:0;
    }
    .trackpad {
      flex:1; width:100%;
      background:var(--bg); border:1px solid var(--border);
      border-radius:var(--r-lg);
      touch-action:none; user-select:none;
      position:relative; min-height:0;
    }
    .trackpad::after {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background:radial-gradient(ellipse at 50% 50%, rgba(77,157,224,.04), transparent 70%);
      pointer-events:none;
    }
    .mouse-btns { display:flex; gap:8px; width:100%; }
    .mb {
      flex:1; height:58px;
      border:1px solid var(--border); border-radius:var(--r-md);
      background:var(--surface2); color:var(--text);
      font-family:'Sora',sans-serif; font-size:.8rem; font-weight:500; letter-spacing:.05em;
      cursor:pointer; transition:background .12s,border-color .12s,transform .1s;
    }
    .mb:active { background:var(--accent-dim); border-color:var(--accent); transform:scale(.97); }

    .bot-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      border-top:1px solid var(--border); flex-shrink:0;
    }
    .icon-btn {
      width:52px; height:52px; border-radius:var(--r-md);
      border:1px solid var(--border); background:var(--surface2);
      color:var(--text); font-size:1.35rem;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .12s,border-color .12s;
    }
    .icon-btn:active { background:var(--accent-dim); border-color:var(--accent); }

    .menu-overlay {
      position:absolute; inset:0;
      background:rgba(6,10,18,.88);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:20; opacity:0; pointer-events:none; transition:opacity .22s;
    }
    .menu-overlay.open { opacity:1; pointer-events:all; }
    .menu-card {
      background:var(--surface2); border:1px solid var(--border-hi);
      border-radius:var(--r-xl); padding:20px 14px;
      width:calc(100% - 48px); max-width:300px;
      display:flex; flex-direction:column; gap:9px;
    }
    .menu-head { text-align:center; font-size:.66rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
    .menu-btn {
      padding:13px 14px; border-radius:var(--r-md);
      border:1px solid var(--border); background:var(--surface3);
      color:var(--text); font-family:'Sora',sans-serif;
      font-size:.88rem; font-weight:500; cursor:pointer; text-align:left;
      transition:background .12s,border-color .12s;
    }
    .menu-btn:active { background:var(--accent-dim); border-color:var(--accent); }
    .menu-btn.danger { color:var(--danger); }
    .menu-btn.danger:active { background:rgba(224,85,85,.15); border-color:var(--danger); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <span class="app-name">ZamudioPilot · Mouse</span>
    <div class="status">
      <div class="dot off" id="dot"></div>
      <span id="connLabel">Conectando…</span>
    </div>
  </div>

  <div class="tp-section">
    <div id="trackpad" class="trackpad"></div>
    <div class="mouse-btns">
      <button id="left-btn" class="mb">Left Click</button>
      <button class="mb" onclick="socket.emit('mouse_click',{button:'right'})">Right Click</button>
    </div>
  </div>

  <div class="bot-bar">
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
    <button class="icon-btn" onclick="go('/')">⌨️</button>
  </div>

  <div id="menu" class="menu-overlay">
    <div class="menu-card">
      <div class="menu-head">ZamudioPilot</div>
      <button class="menu-btn" onclick="go('/')">🏠 Inicio</button>
      <button class="menu-btn" onclick="go('/mouse')">🖱 Solo Mouse</button>
      <button class="menu-btn" onclick="cmd('special','suspend');toggleMenu()">💤 Reposo</button>
      <button class="menu-btn danger" onclick="cmd('special','off');toggleMenu()">⏻ Apagar PC</button>
      <button class="menu-btn" onclick="toggleMenu()">✕ Cerrar</button>
    </div>
  </div>
</div>

<script src="/static/trackpad.js"></script>
<script>
  const socket = io();
  const dot   = document.getElementById('dot');
  const label = document.getElementById('connLabel');
  socket.on('connect',    () => { dot.classList.remove('off'); label.textContent = 'Conectado'; });
  socket.on('disconnect', () => { dot.classList.add('off');    label.textContent = 'Sin conexión'; });

  const cmd = (t, d) => socket.emit(t, d);
  const go  = url => window.location.href = url;

  const menu = document.getElementById('menu');
  function toggleMenu() { menu.classList.toggle('open'); }

  initTrackpad('trackpad', 'left-btn');
</script>
</body>
</html>
